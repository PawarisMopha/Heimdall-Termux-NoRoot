name: Build Heimdall for Termux

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r27c

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake libusb-1.0-0-dev g++-aarch64-linux-gnu

    - name: Run Heimdall Build Script
      run: |
        chmod +x setup.sh
        # จำลองการส่งออกพาธเพื่อให้สคริปต์ของบอร์ดยอมทำงานร่วมกับ NDK
        export ANDROID_NDK_ROOT=$ANDROID_NDK_HOME
        bash setup.sh

    - name: Archive production artifacts
      uses: actions/upload-artifact@v4
      with:
        name: heimdall-termux-arm64
        path: |
          Heimdall/heimdall
          heimdall
          build/bin/heimdall
        if-no-files-found: ignore
