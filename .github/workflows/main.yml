name: Build Heimdall for Termux

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r25c

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake libusb-1.0-0-dev

    - name: Build Heimdall via NDK Standalone Toolchain
      run: |
        git submodule update --init --recursive
        
        # ค้นหาตำแหน่งไฟล์ CMakeLists.txt
        TARGET_DIR=$(dirname $(find . -name "CMakeLists.txt" | head -n 1))
        echo "Moving to target directory: $TARGET_DIR"
        cd "$TARGET_DIR"
        
        mkdir build && cd build
        cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
              -DANDROID_ABI=arm64-v8a \
              -DANDROID_PLATFORM=android-24 \
              -DANDROID_STL=c++_static \
              -DDISABLE_FRONTEND=ON \
              ..
        make -j$(nproc)

    - name: Archive production artifacts
      uses: actions/upload-artifact@v4
      with:
        name: heimdall-termux-arm64
        path: |
          **/build/bin/heimdall
